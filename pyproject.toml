[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherops-rag-engine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv",
    "sentence-transformers",
    "qdrant-client",
    "GitPython",
]

[project.scripts]
aetherops-rag-engine-indexer = "indexer_app.cli:main"
aetherops-rag-engine-retriever = "retriever_app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "numpy",
    "ruff",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]